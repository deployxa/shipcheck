name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: gofmt (enforced)
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - name: tests
        run: go test -race ./...

  build-matrix:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: ubuntu-latest, goarch: arm64, goos: linux }
          - { os: macos-latest, goos: darwin, goarch: amd64 }
          - { os: macos-latest, goos: darwin, goarch: arm64 }
          - { os: windows-latest, goos: windows, goarch: amd64 }
    runs-on: ${{ matrix.os }}
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          [ "$V" = "${GITHUB_REF_NAME}" ] && V="0.0.0-snapshot"
          go build -ldflags "-X github.com/deployxa/shipcheck/internal/cli.Version=$V -X github.com/deployxa/shipcheck/internal/cli.Commit=$(git rev-parse --short HEAD)" -o "shipcheck-${V}-${GOOS}-${GOARCH}${{ runner.os == 'Windows' && '.exe' || '' }}" ./cmd/shipcheck
      - name: smoke test
        shell: bash
        run: |
          ./shipcheck-* version
          ./shipcheck-* rules --format json > /dev/null

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [check, build-matrix]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: build release artifacts
        run: make release VERSION="${GITHUB_REF_NAME#v}" COMMIT="$(git rev-parse --short HEAD)"
      - name: verify checksums
        run: |
          cd dist
          sha256sum -c shipcheck-*-checksums.sha256
      - name: upload artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
