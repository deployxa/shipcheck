<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#12251D"/>
      <stop offset="60%" stop-color="#0B0F13"/>
      <stop offset="100%" stop-color="#070A0D"/>
    </radialGradient>
    <linearGradient id="card-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="50%" stop-color="#1A202C"/>
      <stop offset="100%" stop-color="#10151C"/>
    </linearGradient>
    <linearGradient id="term-header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2630"/>
      <stop offset="100%" stop-color="#141A22"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E58F"/>
      <stop offset="100%" stop-color="#00F59B"/>
    </linearGradient>
    <!-- Pattern for Engineering Grid -->
    <pattern id="eng-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161F28" stroke-width="0.75"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="640" fill="url(#bg-glow)"/>
  <rect width="1280" height="640" fill="url(#eng-grid)" opacity="0.8"/>

  <!-- Top Decorative Engineering Status Bar -->
  <g transform="translate(80, 56)">
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#131B22" stroke="#25313D" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#00F59B"/>
    <text x="28" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1" fill="#9AA4B2">OPEN SOURCE v0.1</text>

    <!-- Deployxa attribution -->
    <text x="960" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500" letter-spacing="1.5" fill="#6B7785">BUILT BY DEPLOYXA</text>
  </g>

  <!-- Left Column: Identity & Positioning -->
  <g transform="translate(80, 130)">
    <!-- Main Icon (Scaled 1.25x) -->
    <g transform="translate(0, 0) scale(1.1)">
      <polygon points="64,16 106,40 106,88 64,112 22,88 22,40" fill="#080B0E" stroke="#303A46" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="64,18 103,40 64,62 25,40" fill="#1A222B" stroke="#303A46" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="44" y1="29" x2="83" y2="51" stroke="#374352" stroke-width="1" stroke-dasharray="2 2"/>
      <polygon points="25,41 64,63 64,109 25,87" fill="#10161C" stroke="#303A46" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="38" y1="48" x2="38" y2="94" stroke="#222C37" stroke-width="1.5"/>
      <line x1="51" y1="55" x2="51" y2="101" stroke="#222C37" stroke-width="1.5"/>
      <polygon points="64,63 103,41 103,87 64,109" fill="#141B22" stroke="#303A46" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="77" y1="55" x2="77" y2="101" stroke="#25303D" stroke-width="1.5"/>
      <line x1="90" y1="48" x2="90" y2="94" stroke="#25303D" stroke-width="1.5"/>
      <path d="M16,36 L16,28 L24,28" stroke="#485666" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M112,36 L112,28 L104,28" stroke="#485666" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M16,92 L16,100 L24,100" stroke="#485666" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M112,92 L112,100 L104,100" stroke="#485666" stroke-width="1.5" stroke-linecap="round"/>
      <polyline points="44,72 58,86 94,44" fill="none" stroke="#080B0E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="44,72 58,86 94,44" fill="none" stroke="url(#accent-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="94" cy="44" r="3" fill="#FFFFFF"/>
    </g>

    <!-- Wordmark & Tagline -->
    <text x="160" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF">ship<tspan fill="#00F59B">check</tspan></text>
    <text x="162" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" letter-spacing="2" fill="#8B949E">PRE-DEPLOYMENT READINESS VERIFIER</text>

    <!-- Subtitle / Pitch -->
    <text x="0" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" line-height="34" fill="#C9D1D9">
      <tspan x="0" dy="0">Find broken Dockerfiles, unresolvable compose stacks,</tspan>
      <tspan x="0" dy="36">undeclared environment variables, and leaked credentials</tspan>
      <tspan x="0" dy="36">before code leaves your machine.</tspan>
    </text>

    <!-- Feature Pillars / Badges -->
    <g transform="translate(0, 340)">
      <rect x="0" y="0" width="144" height="34" rx="6" fill="#121820" stroke="#25303D" stroke-width="1"/>
      <text x="18" y="22" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#E6EDF3">ZERO RUNTIME</text>

      <rect x="156" y="0" width="134" height="34" rx="6" fill="#121820" stroke="#25303D" stroke-width="1"/>
      <text x="174" y="22" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#E6EDF3">100% OFFLINE</text>

      <rect x="302" y="0" width="146" height="34" rx="6" fill="#121820" stroke="#25303D" stroke-width="1"/>
      <text x="320" y="22" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#E6EDF3">SUB-50ms SCAN</text>
    </g>
  </g>

  <!-- Right Column: Interactive Terminal Preview Window -->
  <g transform="translate(680, 130)">
    <!-- Terminal Outer Frame -->
    <rect x="0" y="0" width="520" height="420" rx="10" fill="#0C1015" stroke="url(#card-border)" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect x="0" y="0" width="520" height="38" rx="10" fill="url(#term-header)"/>
    <rect x="0" y="28" width="520" height="10" fill="#141A22"/>
    <line x1="0" y1="38" x2="520" y2="38" stroke="#25303D" stroke-width="1"/>

    <!-- Traffic Lights -->
    <circle cx="20" cy="19" r="5" fill="#EF4444"/>
    <circle cx="36" cy="19" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="19" r="5" fill="#10B981"/>
    <text x="210" y="24" font-family="ui-monospace, monospace" font-size="12" fill="#6B7785">shipcheck scan</text>

    <!-- Terminal Code Text -->
    <g transform="translate(24, 64)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" line-height="20">
      <!-- Command prompt -->
      <text x="0" y="0" fill="#6B7785">$ <tspan fill="#F0F6FC">shipcheck ./my-app</tspan></text>
      
      <!-- Scan metadata -->
      <text x="0" y="26" fill="#6B7785">Scanned 48 files across 2 projects in 0.03s</text>

      <!-- Finding 1: Critical Build -->
      <g transform="translate(0, 56)">
        <rect x="0" y="-12" width="76" height="18" rx="3" fill="#3B1214"/>
        <text x="6" y="1" font-size="10.5" font-weight="700" fill="#F87171">CRITICAL</text>
        <text x="86" y="1" fill="#E6EDF3">SC-BLD-001 <tspan fill="#8B949E">package.json:6</tspan></text>
        <text x="0" y="20" fill="#8B949E">  evidence: "start": "nodemon server.js"</text>
        <text x="0" y="38" fill="#00F59B">  fix: Use production runner "node server.js"</text>
      </g>

      <!-- Finding 2: High Compose -->
      <g transform="translate(0, 126)">
        <rect x="0" y="-12" width="50" height="18" rx="3" fill="#382110"/>
        <text x="6" y="1" font-size="10.5" font-weight="700" fill="#FBBF24">HIGH</text>
        <text x="60" y="1" fill="#E6EDF3">SC-CMP-001 <tspan fill="#8B949E">docker-compose.yml:14</tspan></text>
        <text x="0" y="20" fill="#8B949E">  evidence: depends_on references undefined "cache"</text>
        <text x="0" y="38" fill="#00F59B">  fix: Declare service "cache" or remove dependency</text>
      </g>

      <!-- Finding 3: Medium Env -->
      <g transform="translate(0, 196)">
        <rect x="0" y="-12" width="62" height="18" rx="3" fill="#252417"/>
        <text x="6" y="1" font-size="10.5" font-weight="700" fill="#FDE047">MEDIUM</text>
        <text x="72" y="1" fill="#E6EDF3">SC-ENV-001 <tspan fill="#8B949E">src/db.js:12</tspan></text>
        <text x="0" y="20" fill="#8B949E">  evidence: DATABASE_URL not declared in template</text>
        <text x="0" y="38" fill="#00F59B">  fix: Add to .env.example or compose env block</text>
      </g>

      <!-- Summary Divider -->
      <line x1="0" y1="262" x2="472" y2="262" stroke="#25303D" stroke-width="1"/>
      <text x="0" y="286" fill="#F87171" font-weight="700">Exit 1: 3 finding(s) at or above high threshold</text>
    </g>
  </g>
</svg>
