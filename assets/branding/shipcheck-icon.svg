<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="sc-top" x1="64" y1="18" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#212A35"/>
      <stop offset="100%" stop-color="#141B22"/>
    </linearGradient>
    <linearGradient id="sc-left" x1="24" y1="42" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#182029"/>
      <stop offset="100%" stop-color="#0E1318"/>
    </linearGradient>
    <linearGradient id="sc-right" x1="104" y1="42" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B242E"/>
      <stop offset="100%" stop-color="#10161C"/>
    </linearGradient>
    <linearGradient id="sc-accent" x1="42" y1="76" x2="96" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E58F"/>
      <stop offset="100%" stop-color="#00F59B"/>
    </linearGradient>
  </defs>

  <!-- Container Base Outline / Drop Shadow -->
  <polygon points="64,16 106,40 106,88 64,112 22,88 22,40" fill="#080B0E" stroke="#303A46" stroke-width="2" stroke-linejoin="round"/>

  <!-- Isometric Faces -->
  <!-- Top Face -->
  <polygon points="64,18 103,40 64,62 25,40" fill="url(#sc-top)" stroke="#303A46" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Top Face Grid Detail (cargo ribs) -->
  <line x1="44" y1="29" x2="83" y2="51" stroke="#374352" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="54" y1="23" x2="93" y2="45" stroke="#374352" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Left Face -->
  <polygon points="25,41 64,63 64,109 25,87" fill="url(#sc-left)" stroke="#303A46" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Left Ribs -->
  <line x1="38" y1="48" x2="38" y2="94" stroke="#222C37" stroke-width="1.5"/>
  <line x1="51" y1="55" x2="51" y2="101" stroke="#222C37" stroke-width="1.5"/>

  <!-- Right Face -->
  <polygon points="64,63 103,41 103,87 64,109" fill="url(#sc-right)" stroke="#303A46" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right Ribs -->
  <line x1="77" y1="55" x2="77" y2="101" stroke="#25303D" stroke-width="1.5"/>
  <line x1="90" y1="48" x2="90" y2="94" stroke="#25303D" stroke-width="1.5"/>

  <!-- Precision Inspection Reticle / Corner Markers -->
  <path d="M16,36 L16,28 L24,28" stroke="#485666" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M112,36 L112,28 L104,28" stroke="#485666" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M16,92 L16,100 L24,100" stroke="#485666" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M112,92 L112,100 L104,100" stroke="#485666" stroke-width="1.5" stroke-linecap="round"/>

  <!-- The Verification Chevron / Dynamic Check -->
  <!-- Backing dark contour for high contrast -->
  <polyline points="44,72 58,86 94,44" fill="none" stroke="#080B0E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Electric Lime / Mint Glow Checkmark -->
  <polyline points="44,72 58,86 94,44" fill="none" stroke="url(#sc-accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Verification Pulse Point at apex -->
  <circle cx="94" cy="44" r="2.5" fill="#FFFFFF"/>
</svg>
